[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eval-audit"
version = "0.1.1"
description = "Audit coverage of supplied evaluation records."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = []

[project.scripts]
eval-audit = "eval_audit.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/eval_audit"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not slow'"
markers = ["slow: needs the network or takes more than a few seconds"]
